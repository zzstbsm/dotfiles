devices: (
{
    name: "MX Master 3S";
    smartshift:
    {
        on: true;
        threshold: 30;
        torque: 50;
    };
    hiresscroll:
    {
        hires: true;
        invert: false;
        target: false;
    };
    thumbwheel:
    {
        divert: true;
        invert: false;
        left:
        {
            mode: "OnInterval";
            interval: 2;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEDOWN"];
            }
        };
        right:
        {
            mode: "OnInterval";
            interval: 2;
            action =
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEUP"];
            }
        };
    };

    dpi: 2000;

    buttons: (
#        {
#            # Left Scroll
#            cid: 0x5b;
#            action =
#            {
#                type: "Keypress";
#                keys: ["KEY_VOLUMEDOWN"];
#            };
#        },
#        {
#            # Right Scroll
#            cid: 0x5d;
#            action =
#            {
#                type: "Keypress";
#                keys: ["KEY_VOLUMEUP"];
#            };
#        },
        {
            # Gesture button
            cid: 0xc3;
            action =
            {
                type: "Gestures";
                gestures: (
                    {
                        direction: "Up";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA"];
                        };
                    },
                    {
                        direction: "Down";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA"];
                        };
                    },
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_LEFTALT", "KEY_LEFT"];
                        };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_LEFTALT", "KEY_RIGHT"];
                        };
                    },
                    {
                        direction: "None"
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA"];
                        };
                    }
                );
            };
        },
        {
            # Smart Shift button
            cid: 0xc4;
            action =
            {
                type = "ToggleSmartshift";
            };
        }
    );
}
);
