# Install plugins
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # Save/Restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # Auto Save/Restore

# Restore using continuum.
set -g @continuum-restore 'on'

# Reload config
bind r source-file ~/.config/tmux/.tmux.conf

# Allow mouse
set -g mouse on

# Use vi keybindings
setw -g mode-keys vi

# Set focus-events on
set-option -g focus-events on

# Set windows and panes index to start from 1
set -g base-index 1
set -g pane-base-index 1

# When adding and removing windows, reorder the numbering
set -g renumber-windows on

# Disable automatic windows renaming
set-option -g allow-rename off

# Don't wait for an escape sequence after hitting
# Esc. fixes insert mode exit lag in vim.
set-option -sg escape-time 10


# Theme
set-option -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -a terminal-features 'xterm-256color:RGB'

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#a0a9cb'
# set -g status-style 'fg=#a0a9cb bg=#1d2230'

set -g status-right-style 'bg=#212736 fg=#769ff0'
set -g status-right '  %Y-%m-%d %H:%M  '

set -g status-left ''
set -g status-left-length 10

setw -g window-status-current-style 'bg=#769ff0 fg=#e3e5e5'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'bg=#394260 fg=#e3e5e5'
setw -g window-status-format ' #I #W #F '

